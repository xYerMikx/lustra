name: Deploy landing

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'apps/landing/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and build landing
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @lustra/landing build

      - name: Upload dist over FTP
        env:
          HOSTER_FTP_HOST: ${{ secrets.HOSTER_FTP_HOST }}
          HOSTER_FTP_USER: ${{ secrets.HOSTER_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HOSTER_FTP_PASSWORD }}
          HOSTER_FTP_DIR: ${{ secrets.HOSTER_FTP_DIR }}
        run: |
          if [ -z "${HOSTER_FTP_HOST}" ] || [ -z "${HOSTER_FTP_USER}" ] || [ -z "${LFTP_PASSWORD}" ]; then
            echo "Missing HOSTER_FTP_HOST / HOSTER_FTP_USER / HOSTER_FTP_PASSWORD"
            exit 1
          fi

          remote_dir="${HOSTER_FTP_DIR:-.}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          {
            echo 'set cmd:fail-exit yes'
            echo 'set ftp:ssl-allow no'
            echo 'set net:max-retries 3'
            echo 'set net:timeout 30'
            echo 'lcd apps/landing/dist'
            echo "cd ${remote_dir}"
            echo 'mirror --reverse --delete --verbose --exclude-glob .well-known/**'
            echo 'bye'
          } | lftp -u "${HOSTER_FTP_USER}" "ftp://${HOSTER_FTP_HOST}"
