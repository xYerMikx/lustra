name: Deploy landing

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'apps/landing/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-landing.yml'
      - 'scripts/deploy-landing-ftp.py'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and build landing
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          if [ -z "${PUBLIC_APP_URL}" ]; then
            echo "Missing repository variable PUBLIC_APP_URL"
            exit 1
          fi

          pnpm install --frozen-lockfile
          pnpm --filter @lustra/landing build

      - name: Upload dist over FTP
        env:
          HOSTER_FTP_HOST: ${{ secrets.HOSTER_FTP_HOST }}
          HOSTER_FTP_USER: ${{ secrets.HOSTER_FTP_USER }}
          HOSTER_FTP_PASSWORD: ${{ secrets.HOSTER_FTP_PASSWORD }}
          HOSTER_FTP_DIR: ${{ secrets.HOSTER_FTP_DIR }}
        run: |
          if [ -z "${HOSTER_FTP_HOST}" ] || [ -z "${HOSTER_FTP_USER}" ] || [ -z "${HOSTER_FTP_PASSWORD}" ]; then
            echo "Missing HOSTER_FTP_HOST / HOSTER_FTP_USER / HOSTER_FTP_PASSWORD"
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          python3 scripts/deploy-landing-ftp.py
