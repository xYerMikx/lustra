# API service on Railway (Railpack, no Dockerfile).
# In service Settings → Config file path: /deploy/api/railway.toml

[build]
builder = "RAILPACK"
# @lustra/api and workspace deps (contracts, db with prisma generate).
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @lustra/api... build"
watchPatterns = [
  "apps/api/**",
  "packages/contracts/**",
  "packages/db/**",
  "pnpm-lock.yaml",
]

[deploy]
preDeployCommand = "/bin/sh deploy/api/pre-deploy.sh"
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
