name: lustra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lustra
      POSTGRES_PASSWORD: lustra
      POSTGRES_DB: lustra_dev
    ports:
      - "5432:5432"
    volumes:
      - lustra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lustra -d lustra_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - lustra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lustra
      MINIO_ROOT_PASSWORD: lustra-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lustra_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lustra lustra-minio; do
        sleep 1;
      done;
      mc mb --ignore-existing local/lustra-media;
      "

volumes:
  lustra_postgres_data:
  lustra_redis_data:
  lustra_minio_data:
