name: lumira

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumira
      POSTGRES_PASSWORD: lumira
      POSTGRES_DB: lumira_dev
    ports:
      - "5432:5432"
    volumes:
      - lumira_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumira -d lumira_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - lumira_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lumira
      MINIO_ROOT_PASSWORD: lumira-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lumira_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lumira lumira-minio; do
        sleep 1;
      done;
      mc mb --ignore-existing local/lumira-media;
      "

volumes:
  lumira_postgres_data:
  lumira_redis_data:
  lumira_minio_data:
